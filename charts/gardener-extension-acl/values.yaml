image:
  repository: ghcr.io/stackitcloud/gardener-extension-acl
  tag: latest
imagePullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"

vpa:
  enabled: true
  resourcePolicy:
    minAllowed:
      cpu: 50m
      memory: 64Mi
  updatePolicy:
    updateMode: "InPlaceOrRecreate"

controllers:
  concurrentSyncs: 5
  ignoreOperationAnnotation: false
  healthcheck:
    concurrentSyncs: 5

disableControllers: []

additionalAllowedCidrs: []

# Default rule applied to Extension resources that do not define a rule of
# their own (e.g. when the extension is enabled for all shoots via autoEnable
# and a Shoot does not specify a providerConfig). A rule from the Shoot's
# providerConfig always takes precedence. When unset, Extension resources
# without a rule are rejected (previous behavior).
defaultRule: {}
