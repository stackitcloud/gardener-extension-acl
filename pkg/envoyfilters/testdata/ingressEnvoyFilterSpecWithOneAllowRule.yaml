configPatches:
- applyTo: NETWORK_FILTER
  match:
    context: GATEWAY
    listener:
      filterChain:
        sni: otc-bar--foo.ingress.testseed.dev.ske.eu01.stackit.cloud
  patch:
    operation: INSERT_FIRST
    value:
      name: acl-ingress
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.filters.network.rbac.v3.RBAC
        rules:
          # action: ALLOW # allow is not being marshaled by protojson as it is the default enum value (0)
          policies:
            acl-ingress:
              permissions:
              - any: true
              principals:
              - remote_ip:
                  address_prefix: 10.180.0.0
                  prefix_len: 16
              - remote_ip:
                  address_prefix: 10.250.0.0
                  prefix_len: 16
              - remote_ip:
                  address_prefix: 10.96.0.0
                  prefix_len: 11
        stat_prefix: envoyrbac
